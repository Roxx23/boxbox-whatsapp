<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Track Your Order — boxbox</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, sans-serif;
      background: #f9f7f4;
      color: #1a1a1a;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .wrapper { width: 100%; max-width: 420px; text-align: center; }
    .logo {
      display: block;
      margin-bottom: 1px;
      text-decoration: none;
    }
    .logo img {
      height: 250px;
      width: auto;
      margin-top: -60px;
      margin-bottom: -60px;
    }
    .card {
      background: #fff;
      border-radius: 20px;
      padding: 40px 32px;
      box-shadow: 0 2px 24px rgba(0,0,0,0.07);
    }
    .icon-wrap {
      width: 72px;
      height: 72px;
      background: #f0f7f0;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
      font-size: 32px;
    }
    h1 { font-size: 20px; font-weight: 700; color: #1a1a1a; margin-bottom: 10px; line-height: 1.3; }
    .order-tag {
      display: inline-block;
      background: #f0f7f0;
      color: #2d7a2d;
      font-size: 13px;
      font-weight: 600;
      padding: 5px 14px;
      border-radius: 20px;
      margin-bottom: 16px;
    }
    .sub { font-size: 14px; color: #666; margin-bottom: 28px; line-height: 1.6; }
    .btn {
      display: block;
      background: #1a1a1a;
      color: #fff;
      font-weight: 700;
      font-size: 15px;
      padding: 16px 24px;
      border-radius: 12px;
      text-decoration: none;
      letter-spacing: 0.3px;
    }
    .courier-tag { font-size: 12px; color: #999; margin-top: 18px; }
    .courier-tag span { color: #1a1a1a; font-weight: 600; }
    .footer { margin-top: 32px; font-size: 12px; color: #aaa; }
    .footer a { color: #aaa; text-decoration: none; }
    .progress { height: 3px; background: #f0f0f0; border-radius: 2px; margin-top: 24px; overflow: hidden; }
    .progress-bar {
      height: 100%;
      background: #1a1a1a;
      border-radius: 2px;
      width: 0%;
      animation: fill 4s linear forwards;
    }
    @keyframes fill { to { width: 100%; } }
  </style>
</head>
<body>
  <div class="wrapper">
    <a class="logo" href="https://boxbox.in"><img src="static/boxbox-logo.png" alt="boxbox"></a>
    <div class="card">
      <div class="icon-wrap">🚚</div>
      <div class="order-tag">Order #F14837</div>
      <h1>Your order is on its way!</h1>
      <p class="sub">We're taking you to <span style="font-weight:600;">DTDC</span> to track your shipment live.</p>
      <a class="btn" href="#">Track My Order →</a>
      <div class="courier-tag">Shipped via <span>DTDC</span></div>
      <div class="progress"><div class="progress-bar"></div></div>
    </div>
    <div class="footer">
      Questions? <a href="https://boxbox.in">Visit boxbox.in</a> or reply to your WhatsApp message.
    </div>
  </div>
</body>
</html>
