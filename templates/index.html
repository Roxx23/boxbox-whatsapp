<!doctype html>
<html lang="en">
<head>
  <title>WhatsApp Bulk Sender</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-dark text-light">
<div class="container py-4">

  <h1 class="mb-4">WhatsApp Bulk Sender 🚀</h1>

  {% with messages = get_flashed_messages() %}
    {% if messages %}
      <div class="alert alert-warning">
        {% for m in messages %}
          <div>{{ m }}</div>
        {% endfor %}
      </div>
    {% endif %}
  {% endwith %}

  <form method="POST" enctype="multipart/form-data" class="card p-3 bg-secondary">

      <!-- CSV Upload -->
      <label class="form-label">Upload CSV:</label>
      <input type="file" name="csv_file" id="csv_file" class="form-control mb-3" required>

      <!-- TEMPLATE DROPDOWN -->
      <label class="form-label">Choose WhatsApp Template</label>
      <select name="template_name" id="template_name" class="form-control mb-3">
          <option value="none">-- No Template (Use Custom Message) --</option>
          {% for t in templates %}
              <option value="{{ t.name }}">{{ t.name }} ({{ t.category }})</option>
          {% endfor %}
      </select>

      <!-- Dynamic parameter container -->
      <div id="param_box"></div>

      <!-- CUSTOM MESSAGE -->
      <label class="form-label mt-3">Custom Message (only if not using template):</label>
      <textarea class="form-control mb-3" name="message_template" id="msg_box" rows="3"></textarea>

      <!-- SEND MODE -->
      <label class="form-label d-block">Send Mode</label>
      <input type="radio" name="send_mode" value="now" checked> Send Now
      <input type="radio" name="send_mode" value="later" class="ms-3"> Schedule Later

      <input type="text" placeholder="18:00" name="send_time" class="form-control mt-3">

      <button class="btn btn-success mt-4">Start Sending</button>
  </form>
</div>

<script>
let csvColumns = [];

// Handle CSV upload
document.getElementById("csv_file").addEventListener("change", function(e) {
    const file = e.target.files[0];
    if (!file) return;

    const formData = new FormData();
    formData.append("csv_file", file);

    fetch("/get-csv-columns", {
        method: "POST",
        body: formData
    })
    .then(res => res.json())
    .then(data => {
        if (data.columns) {
            csvColumns = data.columns;
            // Re-render parameter dropdowns if template is already selected
            const selectedTemplate = document.getElementById("template_name").value;
            if (selectedTemplate !== "none") {
                document.getElementById("template_name").dispatchEvent(new Event('change'));
            }
        }
    })
    .catch(err => console.error("Error reading CSV:", err));
});

// Handle template selection
document.getElementById("template_name").addEventListener("change", function () {
    const selected = this.value;
    const paramBox = document.getElementById("param_box");

    if (selected === "none") {
        paramBox.innerHTML = "";
        return;
    }

    if (csvColumns.length === 0) {
        paramBox.innerHTML = "<div class='text-warning'>Please upload CSV first</div>";
        return;
    }

    fetch("/template-info?name=" + selected)
      .then(res => res.json())
      .then(data => {
          if (data.count === 0) {
              paramBox.innerHTML = "<div class='text-info'>This template has 0 parameters.</div>";
              return;
          }

          let html = "<label class='form-label text-warning mt-2'>Template Parameters</label>";

          for (let i = 1; i <= data.count; i++) {
              html += `
                <label class="form-label">Parameter ${i} maps to CSV column:</label>
                <select name="param${i}" class="form-control mb-2" id="param${i}" required>
                  <option value="">-- Select Column --</option>
              `;
              
              csvColumns.forEach(col => {
                  html += `<option value="${col}">${col}</option>`;
              });
              
              html += `</select>`;
          }

          paramBox.innerHTML = html;
      });
});
</script>

</body>
</html>
