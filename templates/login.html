<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - WhatsApp Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #F1F5F9;
            background-image:
                radial-gradient(ellipse 60% 50% at 50% 0%, rgba(37,211,102,0.08) 0%, transparent 70%),
                radial-gradient(ellipse 40% 30% at 100% 100%, rgba(18,140,126,0.05) 0%, transparent 60%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'DM Sans', 'Segoe UI', system-ui, sans-serif;
            padding: 1rem;
        }

        .login-card {
            background: #fff;
            border-radius: 20px;
            box-shadow: 0 4px 24px rgba(15,23,42,0.08), 0 1px 4px rgba(15,23,42,0.04);
            border: 1px solid #E2E8F0;
            overflow: hidden;
            max-width: 400px;
            width: 100%;
        }

        .login-header {
            padding: 2.25rem 2rem 1.75rem;
            text-align: center;
            border-bottom: 1px solid #E2E8F0;
        }

        .brand-icon {
            width: 52px; height: 52px;
            background: linear-gradient(135deg, #25D366, #128C7E);
            border-radius: 14px;
            display: inline-flex; align-items: center; justify-content: center;
            font-size: 1.4rem; color: white;
            margin-bottom: 1rem;
            box-shadow: 0 4px 14px rgba(37,211,102,0.3);
        }

        .login-header h1 {
            font-size: 1.35rem;
            font-weight: 700;
            color: #0F172A;
            margin: 0 0 0.3rem;
            letter-spacing: -0.01em;
        }

        .login-header p {
            color: #64748B;
            font-size: 0.875rem;
            margin: 0;
        }

        .login-body {
            padding: 2rem;
        }

        .form-label {
            font-weight: 600;
            color: #64748B;
            font-size: 0.83rem;
            margin-bottom: 0.4rem;
        }

        .form-control {
            background: #F8FAFC;
            border: 1px solid #E2E8F0;
            border-radius: 9px;
            padding: 0.65rem 0.9rem;
            font-size: 0.9rem;
            color: #0F172A;
            transition: all 0.18s;
            font-family: inherit;
        }

        .form-control:focus {
            background: #fff;
            border-color: #25D366;
            box-shadow: 0 0 0 3px rgba(37,211,102,0.1);
            outline: none;
            color: #0F172A;
        }

        .form-control::placeholder { color: #94A3B8; }

        .password-wrap { position: relative; }
        .toggle-btn {
            position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
            background: none; border: none; color: #94A3B8; cursor: pointer;
            padding: 0.2rem; font-size: 0.9rem; transition: color 0.15s; line-height: 1;
        }
        .toggle-btn:hover { color: #64748B; }

        .form-check-input { accent-color: #25D366; }
        .form-check-label { font-size: 0.875rem; color: #64748B; }

        .btn-login {
            background: #25D366;
            border: none;
            border-radius: 9px;
            padding: 0.75rem;
            font-weight: 600;
            font-size: 0.95rem;
            color: white;
            width: 100%;
            margin-top: 0.5rem;
            transition: all 0.18s;
            font-family: inherit;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(37,211,102,0.25);
        }

        .btn-login:hover {
            background: #34D974;
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(37,211,102,0.35);
            color: white;
        }

        .btn-login:active {
            background: #128C7E;
            transform: none;
        }

        .alert-danger {
            background: rgba(239,68,68,0.06);
            border: 1px solid rgba(239,68,68,0.15);
            color: #DC2626;
            border-radius: 9px;
            font-size: 0.875rem;
            padding: 0.75rem 1rem;
        }

        .alert-success {
            background: rgba(22,163,74,0.06);
            border: 1px solid rgba(22,163,74,0.15);
            color: #15803D;
            border-radius: 9px;
            font-size: 0.875rem;
            padding: 0.75rem 1rem;
        }

        .alert-info {
            background: rgba(37,99,235,0.06);
            border: 1px solid rgba(37,99,235,0.15);
            color: #1D4ED8;
            border-radius: 9px;
            font-size: 0.875rem;
            padding: 0.75rem 1rem;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="login-header">
            <div class="brand-icon"><i class="fab fa-whatsapp"></i></div>
            <h1>WA Dashboard</h1>
            <p>Sign in to your account</p>
        </div>

        <div class="login-body">
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="alert alert-{{ 'danger' if category == 'error' else category }} mb-3" role="alert">
                            {{ message }}
                        </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form method="POST" action="{{ url_for('login') }}">
                <div class="mb-3">
                    <label for="username" class="form-label">Username or Email</label>
                    <input type="text" class="form-control" id="username" name="username"
                           placeholder="hello@example.com" required autofocus>
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <div class="password-wrap">
                        <input type="password" class="form-control" id="password" name="password"
                               placeholder="••••••••" required>
                        <button type="button" class="toggle-btn" onclick="togglePassword()">
                            <i class="fas fa-eye" id="toggleIcon"></i>
                        </button>
                    </div>
                </div>

                <div class="form-check mb-3">
                    <input class="form-check-input" type="checkbox" id="remember" name="remember">
                    <label class="form-check-label" for="remember">Remember me</label>
                </div>

                <button type="submit" class="btn btn-login">
                    <i class="fas fa-sign-in-alt me-2"></i>Sign In
                </button>
            </form>
        </div>
    </div>

    <script>
        function togglePassword() {
            const input = document.getElementById('password');
            const icon  = document.getElementById('toggleIcon');
            if (input.type === 'password') {
                input.type = 'text';
                icon.className = 'fas fa-eye-slash';
            } else {
                input.type = 'password';
                icon.className = 'fas fa-eye';
            }
        }
    </script>
</body>
</html>
